<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Constructorfleet icon</title>
  <desc id="desc">A small yellow bulldozer pushing stacked orange c and gray f bricks.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#111216" flood-opacity=".35"/>
    </filter>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff7a4d"/><stop offset="1" stop-color="#df4e23"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6b6c72"/><stop offset="1" stop-color="#4a4b50"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffda24"/><stop offset="1" stop-color="#e9ab00"/>
    </linearGradient>
  </defs>

  <g stroke="#111216" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M131 8h96l15 15v91l-10 10H127l-10-10V23Z" fill="url(#orange)" stroke-width="6"/>
    <path d="M131 14h94l9 9H125Z" fill="#ff9a76" stroke="none" opacity=".8"/>
    <path d="M127 127h105l10 10v95l-10 10H127l-10-10v-95Z" fill="url(#concrete)" stroke-width="6"/>
    <path d="M128 133h103l4 5H123Z" fill="#85868c" stroke="none" opacity=".65"/>
  </g>

  <g fill="#f3e5cc" stroke="#111216" stroke-width="3" stroke-linejoin="round" filter="url(#rough)">
    <path d="M211 49c-8-8-18-12-29-12-24 0-40 16-40 41s16 41 41 41c12 0 22-4 30-12l-14-17c-5 5-10 7-16 7-11 0-18-7-18-19s7-19 18-19c7 0 12 2 17 7Z"/>
    <path d="M171 218v-51h-10v-20h10v-4c0-19 11-30 31-30 8 0 15 2 21 5l-6 19c-3-2-6-3-10-3-7 0-11 4-11 11v2h20v20h-20v51Z"/>
  </g>

  <g filter="url(#shadow)" stroke="#111216" stroke-linejoin="round">
    <path d="M9 177h91l16 16-9 43H18L6 222Z" fill="#2a2b30" stroke-width="5"/>
    <rect x="13" y="197" width="92" height="37" rx="18" fill="#34363b" stroke-width="4"/>
    <g fill="#ffc400" stroke-width="4">
      <circle cx="31" cy="216" r="12"/><circle cx="58" cy="216" r="12"/><circle cx="85" cy="216" r="12"/>
    </g>
    <g fill="#686a70" stroke-width="3">
      <circle cx="31" cy="216" r="5"/><circle cx="58" cy="216" r="5"/><circle cx="85" cy="216" r="5"/>
    </g>
    <path d="M18 168 28 139h55l20 31 4 28H9l3-21Z" fill="url(#yellow)" stroke-width="5"/>
    <path d="M39 139h42l16 29H30Z" fill="#63bdcc" stroke-width="5"/>
    <path d="M67 139v29M81 139l16 29" fill="none" stroke-width="4" opacity=".8"/>
    <path d="M25 134h62l6 7H22Z" fill="#ffc400" stroke-width="5"/>
    <rect x="72" y="128" width="17" height="16" rx="3" fill="#f7f4ee" stroke-width="4"/>
    <path d="M96 176 118 168v68H96l9-25-7-18Z" fill="url(#yellow)" stroke-width="5"/>
    <path d="M118 168h12l-3 68h-9Z" fill="#ffdc35" stroke-width="4"/>
  </g>
